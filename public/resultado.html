<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultado | A Fazenda 2026</title>
  <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="lib/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="js/resultado.js"></script>
</head>

<body>
  <header class="border-bottom border-warning border-3">
    <nav class="navbar navbar-expand-md" data-bs-theme="dark" aria-label="Menu principal">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <img src="img/logo-fazenda.jpg" alt="A Fazenda" width="74" height="56" class="rounded object-fit-cover">
          Votação 2026
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
          aria-controls="menu" aria-expanded="false" aria-label="Alternar menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto gap-1">
            <li class="nav-item"><a class="nav-link rounded px-3" href="index.html">Início</a></li>
            <li class="nav-item"><a class="nav-link rounded px-3" href="votacao.html">Votar</a></li>
            <li class="nav-item"><a class="nav-link rounded px-3 active" aria-current="page"
                href="resultado.html">Resultado</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main class="container py-5">
    <h1>Parcial da eliminação</h1>
    <p><strong id="total" class="fs-2 text-warning">—</strong> votos computados</p>
    <div id="mensagem" role="status"></div>
    <div id="placar" class="d-grid gap-3"></div>
    <button type="button" id="zerar" class="btn btn-outline-light mt-4 d-none" data-bs-toggle="modal"
      data-bs-target="#confirmacao">Zerar votação</button>

    <div class="modal fade" id="confirmacao" tabindex="-1" aria-labelledby="titulo-confirmacao" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="titulo-confirmacao" class="modal-title fs-5">Zerar votação?</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">Todos os votos registrados serão apagados</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" id="confirmar" class="btn btn-danger" data-bs-dismiss="modal">Apagar votos</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  
</body>

</html>
